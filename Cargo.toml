[package]
name = "PortScanner"
version = "0.2.0"
edition = "2024"

[dependencies]
regex = "1.12.4"
rayon = "1.12"
eframe = "0.35.0"
egui = "0.35.0"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6.0.0"
windows-sys = "0.61.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[[bin]]
name = "PortScanner"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.11"